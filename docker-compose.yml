version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: hitrang_db
    command: --sort-buffer-size=16M --max-allowed-packet=64M
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: hitrang_root_pass
      MYSQL_DATABASE: hitrang
      MYSQL_USER: hitrang
      MYSQL_PASSWORD: hitrang_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      timeout: 20s
      retries: 10

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hitrang-app:latest
    container_name: hitrang_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=hitrang
      - DB_PASSWORD=hitrang_pass
      - DB_NAME=hitrang
      - JWT_SECRET=hitrang_grading_jwt_secret_key_2026_xyz
      - ADMIN_PASSKEY=hitrang2026
      - PORT=8080
      - VITE_GOOGLE_CLIENT_ID=$VITE_GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
      - BACKUP_DIR=/app/backups
    volumes:
      - ./backup:/app/backup
      - ./backups:/app/backups
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: hitrang_caddy
    restart: always
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
