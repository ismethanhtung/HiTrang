version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: hitrang_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: hitrang_root_pass
      MYSQL_DATABASE: hitrang
      MYSQL_USER: hitrang
      MYSQL_PASSWORD: hitrang_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      timeout: 20s
      retries: 10

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hitrang_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=hitrang
      - DB_PASSWORD=hitrang_pass
      - DB_NAME=hitrang
      - JWT_SECRET=hitrang_grading_jwt_secret_key_2026_xyz
      - ADMIN_PASSKEY=hitrang2026
      - PORT=8080
    volumes:
      - ./backup:/app/backup
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
